---
name: Supabase Backup
'on':
  schedule:
    - cron: 0 2 * * *  # daily at 02:00 UTC
  workflow_dispatch: {}  # manual trigger

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump Supabase DB
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_HOST: db.smyfjmdjzfwdehynwfep.supabase.co
          DB_USER: postgres
        run: |
          mkdir -p backups
          # --schema=public: skip auth/storage/realtime schemas (the bulk of
          # Disk IO on a full dump). -F c: compressed custom format, smaller
          # and faster to restore than plain SQL.
          pg_dump -h $DB_HOST -U $DB_USER -d postgres -F c --schema=public \
            --exclude-table=public.workflow_states \
            -f backups/backup_$(date +%Y%m%d).dump
          # Retention: keep last 7 dumps, delete older ones (unbounded git
          # history of daily dumps grows Disk IO + repo size forever).
          # 2>/dev/null: no dumps yet on a fresh repo must not print noise.
          # NOTE: workflow_states is ephemeral runtime state — restoring it
          # is meaningless, so it is excluded from backups entirely.
          ls -1t backups/backup_*.dump 2>/dev/null | tail -n +8 | xargs -r rm --

      - name: Commit backup
        run: |
          git config user.email "ci@bot"
          git config user.name "CI Bot"
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "backup: $(date +%Y-%m-%d)"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Backup pipeline failed on $(date +%Y-%m-%d). \
          Check workflow logs for details."
