name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # macos-15 image ships Xcode 26.0.1-26.3; there is no Xcode_26.app alias.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build and Test
        # swift test cannot target an iOS simulator (no -destination flag);
        # and building for the host macOS fails on iOS-only UIKit modifiers.
        # Compile-check the pure SwiftPM library instead; device coverage is
        # provided by Xcode Cloud (TestFlight) and xcodebuild schemes.
        run: swift build --target ShowcaseCore

  # The Android build requires the full Skip transpilation toolchain
  # (skip CLI + matching Swift Android SDK). Those artifacts move fast and
  # currently 404 in CI, so this job is disabled until the toolchain pins
  # stabilize. Android release APKs are built locally via `skip export`.
