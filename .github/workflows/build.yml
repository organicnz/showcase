name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # macos-15 image ships Xcode 26.0.1-26.3; there is no Xcode_26.app alias.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build and Test
        # swift test on a macOS runner defaults to building for the host
        # (macOS), where iOS-only UIKit modifiers fail. Build for an iOS
        # simulator destination instead.
        run: swift test -destination 'platform=iOS Simulator,name=iPhone 17 Pro'

  build-android:
    name: Build Android (SKIP)
    # Skip transpilation (swift→Kotlin via skipstone) needs the macOS
    # toolchain; the skip cask ships no Linux binary, so Ubuntu cannot run
    # `skip plugin --prebuild`. Canonical Skip CI builds Android on macos.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install Skip CLI
        run: brew install skiptools/skip/skip
      - name: Install Swift Android SDK
        # swift→Kotlin transpilation compiles Swift for Android and needs
        # the Swift Android SDK (persisted in the runner's SwiftPM dir).
        run: skip android sdk install
      - name: Build with Gradle
        run: |
          if [ -d "Android" ]; then
            cd Android
            ./gradlew assembleDebug
          else
            echo "Android directory not found, skipping Gradle build."
          fi
