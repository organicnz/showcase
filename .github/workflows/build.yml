name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # macos-15 image ships Xcode 26.0.1-26.3; there is no Xcode_26.app alias.
        # This toolchain (Swift 6.3) matters: under Swift 6.4 SwiftPM promotes
        # the Skip package-identity conflict to a hard "linked as a static
        # library ... duplication of library code" error, so the build is
        # pinned to the last known-good toolchain.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build ShowcaseCore
        # swift test cannot target an iOS simulator (no -destination flag);
        # and building for the host macOS fails on iOS-only UIKit modifiers.
        # Compile-check the pure SwiftPM library instead; device coverage is
        # provided by Xcode Cloud (TestFlight) and xcodebuild schemes.
        run: swift build --target ShowcaseCore

  test:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Run test suite
        # The three test targets were present on disk but never declared in
        # Package.swift, so this previously compiled zero tests and reported
        # success. They are declared now, and this job makes them load-bearing.
        run: swift test

  build-android:
    name: Build Android (SKIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install Skip CLI
        run: brew install skiptools/skip/skip
      - name: Cache Swift Android SDK and Gradle
        # The SDK is a large download and `skip android sdk install` was the
        # step this job was missing, not a broken artifact. Cached because a
        # cold Android build runs ~5-6 minutes.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/org.swift.swiftpm/swift-sdks
            ~/.gradle
          key: android-toolchain-${{ runner.os }}-sdk6.3.2-${{ hashFiles('Package.resolved') }}
      - name: Install Swift Android SDK
        # Version must be pinned. Unpinned, the installer resolves to 6.4.0 and
        # fails with "Swift 6.4.0 does not exist at URL
        # .../swift-6.4-RELEASE-osx.pkg" -- there is no 6.4 release .pkg for
        # macOS. 6.3.2 is the version Skip's own installer docs use.
        run: skip android sdk install --version 6.3.2
      - name: Build with Gradle
        working-directory: Android
        run: ./gradlew assembleDebug --stacktrace
