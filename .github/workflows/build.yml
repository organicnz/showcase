name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # macos-15 image ships Xcode 26.0.1-26.3; there is no Xcode_26.app alias.
        # This toolchain (Swift 6.3) matters: under Swift 6.4 SwiftPM promotes
        # the Skip package-identity conflict to a hard "linked as a static
        # library ... duplication of library code" error, so the build is
        # pinned to the last known-good toolchain.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build ShowcaseCore
        # swift test cannot target an iOS simulator (no -destination flag);
        # and building for the host macOS fails on iOS-only UIKit modifiers.
        # Compile-check the pure SwiftPM library instead; device coverage is
        # provided by Xcode Cloud (TestFlight) and xcodebuild schemes.
        run: swift build --target ShowcaseCore

  test:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Run test suite
        # The three test targets were present on disk but never declared in
        # Package.swift, so this previously compiled zero tests and reported
        # success. They are declared now, and this job makes them load-bearing.
        run: swift test

  # Android remains disabled. The toolchain now works end to end in CI -- the
  # Skip CLI installs, `skip android sdk install --version 6.3.2` succeeds, and
  # every module transpiles to Kotlin. The build then fails compiling Skip's own
  # *generated* bridge code:
  #
  #   skip-ui/.../SkipBridgeGenerated/UserNotifications_Bridge.swift:
  #     error: cannot find 'BridgedJob' in scope
  #
  # That is a version mismatch inside the Skip dependency graph (skip-ui 1.55
  # emitting bridge code the resolved skip-bridge 0.16.7 cannot compile), not a
  # fault in this project's code, so it cannot be fixed from here. It needs the
  # dependency decision that is still open: Package.swift mixes Fuse packages
  # (skip-fuse-ui) with Lite packages (skip-ui, skip-av, skip-unit) declared
  # across two host identities (source.skip.tools and github.com/skiptools).
  #
  # Android release APKs are built locally via `skip export` until then.
  #
  # Proven-working sequence once that dependency work lands:
  #   - brew install skiptools/skip/skip
  #   - skip android sdk install --version 6.3.2   # must be pinned; unpinned
  #     # resolves to 6.4.0, which has no macOS release .pkg
  #   - cd Android && ./gradlew assembleDebug
