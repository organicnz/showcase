<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Golden Gradient -->
    <linearGradient id="gold_grad" x1="150" y1="120" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD700"/>
      <stop offset="0.5" stop-color="#FFB900"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </linearGradient>

    <!-- Glass Frosting Effect -->
    <linearGradient id="glass_frost" x1="50" y1="50" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.3"/>
      <stop offset="1" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="premium_shadow" x="120" y="100" width="280" height="320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feOffset dx="0" dy="15" result="offsetBlur"/>
      <feFlood flood-color="#B8860B" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feBlend mode="normal" in="SourceGraphic" in2="shadow"/>
    </filter>

    <!-- Inner Glow for the Glass -->
    <filter id="glass_glow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="out"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="140" fill="#F8F9FA"/>

  <!-- Layer 1: Glass Backdrop -->
  <g id="glass_layer">
    <circle cx="256" cy="256" r="210" fill="url(#glass_frost)" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="256" cy="256" r="209" stroke="black" stroke-opacity="0.03" stroke-width="0.5"/>
  </g>

  <!-- Layer 2: Refined Golden Banana -->
  <g id="banana_layer" filter="url(#premium_shadow)">
    <path d="M185 140C220 110 330 140 365 240C385 300 340 390 310 410C260 380 200 360 185 140Z" fill="url(#gold_grad)"/>
    <!-- Specular Highlight on Banana -->
    <path d="M200 160C225 140 280 160 300 200" stroke="white" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Layer 3: Central Action Icon (Play) -->
  <g id="action_layer">
    <path d="M235 210L315 256L235 302V210Z" fill="white" fill-opacity="0.95"/>
    <path d="M235 210L315 256L235 302V210Z" stroke="black" stroke-opacity="0.05" stroke-width="0.5"/>
  </g>

  <!-- Specular Reflection across the whole logo -->
  <path d="M100 120Q256 50 412 120" stroke="white" stroke-opacity="0.15" stroke-width="40" stroke-linecap="round" filter="blur(15px)"/>
</svg>
