<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Forest / Charcoal Background Gradient -->
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2024"/>
      <stop offset="1" stop-color="#0D1113"/>
    </linearGradient>

    <!-- Glass Frosting Effect -->
    <linearGradient id="glass_frost" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Premium Gold Accent -->
    <linearGradient id="gold_accent" x1="150" y1="150" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5C99F"/>
      <stop offset="0.5" stop-color="#C5A565"/>
      <stop offset="1" stop-color="#8A6B2E"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="premium_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feOffset dx="0" dy="15" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feBlend mode="normal" in="SourceGraphic" in2="shadow"/>
    </filter>

    <!-- Edge Highlight for Glass -->
    <linearGradient id="glass_edge" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg_grad)"/>

  <!-- Liquid Glass Backdrop -->
  <circle cx="256" cy="256" r="180" fill="url(#glass_frost)" stroke="url(#glass_edge)" stroke-width="2" filter="url(#premium_shadow)"/>

  <!-- Architectural Outer Play Button (Glass + Gold Border) -->
  <path d="M206 166 L356 256 L206 346 Z" fill="url(#glass_frost)" stroke="url(#gold_accent)" stroke-width="8" stroke-linejoin="round" filter="url(#premium_shadow)"/>

  <!-- Inner Solid Gold Play Button -->
  <path d="M236 216 L306 256 L236 296 Z" fill="url(#gold_accent)" stroke="url(#gold_accent)" stroke-width="4" stroke-linejoin="round" filter="url(#premium_shadow)"/>

  <!-- Specular Reflection across the logo -->
  <path d="M40 80 Q256 0 472 80" stroke="#ffffff" stroke-opacity="0.1" stroke-width="50" stroke-linecap="round" filter="blur(25px)"/>
</svg>
